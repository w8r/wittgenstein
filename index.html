<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Ludwig Wittgenstein - Tractatus Logico-Philosophicus</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <h1 data-i18n="title">Tractatus Logico-Philosophicus (1922)</h1>
      <h2>
        <span data-i18n="by">by</span>

    <canvas id="canvas"></canvas>
    <nav class="menu" id="menu">
      <div class="menu-panel" id="menu-panel" role="menu" aria-label="Controls">

        <button type="button" role="menuitem" data-action="center">center</button>
        <div class="menu-language" role="group" aria-label="Language">
          <button type="button" data-language="en" aria-pressed="true">EN</button>
          <button type="button" data-language="de" aria-pressed="false">DE</button>
        </div>
      </div>
      <button
        type="button"
        class="menu-toggle"
        aria-label="Menu"
        aria-expanded="false"
        aria-controls="menu-panel"

        <span></span><span></span><span></span>

    <div id="unsupported" hidden>
      <p>This edition is drawn with WebGPU, which your browser doesn’t support yet.</p>
      <p>Read the <a href="classic/">classic version</a> instead.</p>

    <div id="loader">
      <div class="loader-label">Loading</div>
